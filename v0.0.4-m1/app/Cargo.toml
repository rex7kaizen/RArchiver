[package]
name = "rarchiver"
version = "0.0.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rarchiver-core = { path = "../core" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "std", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"

[build-dependencies]
slint-build = "=1.18.1"

[package.metadata.android]
package = "com.kaizen.rarchiver"
apk_name = "rarchiver"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 31

[package.metadata.android.application]
label = "RArchiver"
