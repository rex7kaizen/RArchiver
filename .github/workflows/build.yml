name: build
on:
  workflow_dispatch:
    inputs:
      version_dir:
        description: "Derlenecek sürüm klasörü"
        default: "v0.0.4-m1"
  push:
    branches: [main]
env:
  VERSION_DIR: ${{ inputs.version_dir || 'v0.0.4-m1' }}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.VERSION_DIR }}
      - name: Çekirdek testleri
        working-directory: ${{ env.VERSION_DIR }}
        run: |
          if [ -d core ]; then cargo test -p rarchiver-core; else echo "core yok, atlandı"; fi
      - name: Android SDK/NDK kur
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-31" "build-tools;34.0.0" "ndk;27.2.12479018"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk"
      - name: cargo-apk kur
        run: cargo install cargo-apk --locked
      - name: APK derle
        working-directory: ${{ env.VERSION_DIR }}
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          ls "$ANDROID_NDK_ROOT/source.properties"
          if [ -d app ]; then cd app; fi
          cargo apk build
      - uses: actions/upload-artifact@v4
        with:
          name: rarchiver-apk
          path: ${{ env.VERSION_DIR }}/target/debug/apk/*.apk
          if-no-files-found: error
