[package]
name = "rarchiver"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "std", "backend-android-activity-06", "renderer-femtovg"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.dev]
opt-level = 3

[package.metadata.android]
package = "com.kaizen.rarchiver"
apk_name = "rarchiver"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 31

[package.metadata.android.application]
label = "RArchiver"
